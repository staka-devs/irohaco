name: Bug
description: 不具合の報告
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 現象
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 環境
      placeholder: "例: エミュレーター API 36 / 基準端末, アプリ v1.0.0"
