name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ddl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      # verifyRoborazziDebug makes the unit tests compare screenshots with src/test/screenshots.
      - run: ./gradlew build lint verifyRoborazziDebug --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-and-test-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/test-results/**/*.xml
            **/build/outputs/roborazzi/**
          retention-days: 7

  # ARCHITECTURE §13.0 L2: instrumented tests on the minimum and the latest API.
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      # The emulator and the two system images are a few GB, and downloading them on every run fails now and
      # then. Keep them in the cache, and install them with retries before Gradle needs them.
      - name: Restore emulator and system images
        id: sdk-images
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images
          key: emulator-images-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
      - name: Install emulator and system images
        if: steps.sdk-images.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4; do
            sdkmanager --install "emulator" "system-images;android-33;aosp_atd;x86_64" "system-images;android-37.0;google_apis;x86_64" && exit 0
            echo "sdkmanager failed (attempt $attempt); retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Save emulator and system images
        if: steps.sdk-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images
          key: ${{ steps.sdk-images.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ciGroupDebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-test-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
